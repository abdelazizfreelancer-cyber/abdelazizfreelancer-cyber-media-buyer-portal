<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Buyer Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
:root {
    --bg-dark: #0f1f1b;
    --bg-card: #182b25;
    --bg-lighter: #1e352e;
    --bg-input: rgba(255,255,255,0.04);
    --gold: #d8a651;
    --gold-hover: #e5b964;
    --gold-dim: rgba(216,166,81,0.15);
    --white: #ffffff;
    --text-main: #e8e8e8;
    --text-muted: #8a9e99;
    --text-placeholder: rgba(255,255,255,0.2);
    --border-color: rgba(255, 255, 255, 0.08);
    --border-active: rgba(216,166,81,0.4);
    --danger: #ff6b6b;
    --danger-bg: rgba(255,107,107,0.1);
    --success: #51cf66;
    --success-bg: rgba(81,207,102,0.1);
    --info: #74c0fc;
    --info-bg: rgba(116,192,252,0.1);
    --shadow: 0 4px 24px rgba(0,0,0,0.3);
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.2);
    --radius: 12px;
    --radius-sm: 8px;
    --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Cairo', sans-serif;
    background-color: var(--bg-dark);
    color: var(--text-main);
    line-height: 1.7;
    direction: rtl;
    text-align: right;
    min-height: 100vh;
}

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg-dark); }
::-webkit-scrollbar-thumb { background: var(--bg-lighter); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--gold); }

h1, h2, h3, h4 { font-weight: 700; }
a { color: var(--gold); text-decoration: none; transition: color var(--transition); }
a:hover { color: var(--gold-hover); }

/* ─── Utilities ─── */
.gold-text { color: var(--gold); }
.text-muted { color: var(--text-muted); }
.text-success { color: var(--success); }
.text-danger { color: var(--danger); }
.hidden { display: none !important; }

/* ─── Container ─── */
.container {
    max-width: 900px;
    margin: 0 auto;
    padding: 30px 20px;
}

/* ─── Buttons ─── */
.btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: transparent;
    border: 1px solid var(--border-active);
    color: var(--gold);
    padding: 10px 24px;
    font-family: 'Cairo', sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    border-radius: var(--radius-sm);
    transition: all var(--transition);
    white-space: nowrap;
}
.btn:hover {
    background: var(--gold);
    color: var(--bg-dark);
    transform: translateY(-1px);
    box-shadow: var(--shadow-sm);
}
.btn:active { transform: translateY(0); }

.btn-primary {
    background: linear-gradient(135deg, var(--gold), #c9943f);
    color: var(--bg-dark);
    border: none;
    font-weight: 700;
}
.btn-primary:hover {
    background: linear-gradient(135deg, var(--gold-hover), var(--gold));
}

.btn-danger {
    border-color: var(--danger);
    color: var(--danger);
}
.btn-danger:hover {
    background: var(--danger);
    color: white;
}

.btn-sm {
    padding: 6px 16px;
    font-size: 0.85rem;
}

.btn-icon {
    width: 40px;
    height: 40px;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
}

.btn-ghost {
    border: none;
    padding: 8px 16px;
}
.btn-ghost:hover {
    background: var(--bg-input);
    color: var(--gold);
    transform: none;
    box-shadow: none;
}

/* ─── Forms ─── */
.form-group {
    margin-bottom: 24px;
}

.form-label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
    font-size: 0.95rem;
    color: var(--text-main);
}

.form-input, .form-select, .form-textarea {
    width: 100%;
    background: var(--bg-input);
    border: 1px solid var(--border-color);
    color: var(--white);
    padding: 12px 16px;
    font-family: 'Cairo', sans-serif;
    font-size: 1rem;
    border-radius: var(--radius-sm);
    transition: all var(--transition);
}
.form-input:focus, .form-select:focus, .form-textarea:focus {
    outline: none;
    border-color: var(--gold);
    background: rgba(255,255,255,0.06);
    box-shadow: 0 0 0 3px var(--gold-dim);
}
.form-input::placeholder { color: var(--text-placeholder); }

.form-textarea {
    resize: vertical;
    min-height: 120px;
}

/* ─── Cards ─── */
.card {
    background: var(--bg-card);
    padding: 24px;
    border-radius: var(--radius);
    margin-bottom: 20px;
    border: 1px solid var(--border-color);
    transition: all var(--transition);
}
.card:hover {
    border-color: rgba(255,255,255,0.12);
}

.card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border-color);
}

/* ─── Stats Cards ─── */
.stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
    margin-bottom: 30px;
}

.stat-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius);
    padding: 20px;
    text-align: center;
    transition: all var(--transition);
}
.stat-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow);
    border-color: var(--border-active);
}

.stat-icon {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
    margin-bottom: 12px;
}
.stat-icon.gold { background: var(--gold-dim); color: var(--gold); }
.stat-icon.green { background: var(--success-bg); color: var(--success); }
.stat-icon.blue { background: var(--info-bg); color: var(--info); }
.stat-icon.red { background: var(--danger-bg); color: var(--danger); }

.stat-number {
    font-size: 2rem;
    font-weight: 800;
    color: var(--white);
    line-height: 1;
    margin-bottom: 4px;
}

.stat-label {
    font-size: 0.85rem;
    color: var(--text-muted);
}

/* ─── Dashboard Header ─── */
.dashboard-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
    padding: 20px 0;
}

.dashboard-header h1 {
    font-size: 1.8rem;
    display: flex;
    align-items: center;
    gap: 12px;
}

.header-actions {
    display: flex;
    gap: 10px;
    align-items: center;
}

/* ─── Tabs ─── */
.tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 24px;
    background: var(--bg-card);
    border-radius: var(--radius);
    padding: 4px;
    border: 1px solid var(--border-color);
    overflow-x: auto;
}

.tab-btn {
    flex: 1;
    padding: 12px 20px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-family: 'Cairo', sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    border-radius: var(--radius-sm);
    transition: all var(--transition);
    white-space: nowrap;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
}
.tab-btn:hover {
    color: var(--white);
    background: rgba(255,255,255,0.05);
}
.tab-btn.active {
    background: var(--gold);
    color: var(--bg-dark);
}
.tab-btn .badge-count {
    background: rgba(255,255,255,0.2);
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 0.75rem;
}
.tab-btn.active .badge-count {
    background: rgba(0,0,0,0.2);
}

/* ─── Client Card (List) ─── */
.client-list-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px;
    background: var(--bg-lighter);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    margin-bottom: 10px;
    transition: all var(--transition);
    cursor: pointer;
}
.client-list-item:hover {
    border-color: var(--border-active);
    background: rgba(216,166,81,0.05);
    transform: translateX(-4px);
}

.client-info {
    display: flex;
    align-items: center;
    gap: 16px;
}

.client-avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--gold-dim);
    color: var(--gold);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 1.1rem;
    flex-shrink: 0;
}

.client-name {
    font-weight: 700;
    font-size: 1rem;
    margin-bottom: 2px;
}

.client-phone {
    font-size: 0.85rem;
    color: var(--text-muted);
    direction: ltr;
    text-align: right;
}

.client-badges {
    display: flex;
    gap: 6px;
}

/* ─── Badges ─── */
.badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 600;
}
.badge-success { background: var(--success-bg); color: var(--success); }
.badge-warning { background: var(--gold-dim); color: var(--gold); }
.badge-danger { background: var(--danger-bg); color: var(--danger); }
.badge-info { background: var(--info-bg); color: var(--info); }

/* ─── Section Title ─── */
.section-title {
    color: var(--gold);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 1.15rem;
}

.section-number {
    background: var(--gold-dim);
    color: var(--gold);
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    font-weight: 800;
    font-size: 0.9rem;
    flex-shrink: 0;
}

/* ─── Slot / Meeting ─── */
.slot-day-group {
    margin-bottom: 12px;
    background: rgba(255,255,255,0.02);
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-color);
    overflow: hidden;
}

.slot-day-header {
    padding: 14px 20px;
    cursor: pointer;
    font-weight: 700;
    color: var(--gold);
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(216,166,81,0.05);
    border: none;
    width: 100%;
    font-family: 'Cairo', sans-serif;
    font-size: 1rem;
    text-align: right;
    direction: rtl;
}
.slot-day-header:hover {
    background: rgba(216,166,81,0.1);
}

.slot-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 20px;
    border-top: 1px solid var(--border-color);
}

.slot-time {
    font-weight: 700;
    font-size: 1.05rem;
}

.slot-link {
    font-size: 0.8rem;
    color: var(--text-muted);
    direction: ltr;
    word-break: break-all;
}

/* ─── Toast / Notifications ─── */
#toast-container {
    position: fixed;
    bottom: 20px;
    left: 20px;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.toast {
    padding: 14px 24px;
    border-radius: var(--radius-sm);
    font-family: 'Cairo', sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 10px;
    animation: slideInToast 0.4s ease;
    box-shadow: var(--shadow);
    min-width: 300px;
    max-width: 450px;
}
.toast-success { background: #1a3a2a; color: var(--success); border: 1px solid rgba(81,207,102,0.3); }
.toast-error { background: #3a1a1a; color: var(--danger); border: 1px solid rgba(255,107,107,0.3); }
.toast-info { background: #1a2a3a; color: var(--info); border: 1px solid rgba(116,192,252,0.3); }
.toast-warning { background: #3a2a1a; color: var(--gold); border: 1px solid rgba(216,166,81,0.3); }

@keyframes slideInToast {
    from { transform: translateX(-100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
}

/* ─── Empty State ─── */
.empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-muted);
}
.empty-state i {
    font-size: 3rem;
    margin-bottom: 16px;
    opacity: 0.3;
}
.empty-state p {
    font-size: 1rem;
}

/* ─── Progress Bar (for wizard) ─── */
.progress-bar-container {
    width: 100%;
    height: 4px;
    background: var(--border-color);
    border-radius: 2px;
    margin-bottom: 30px;
    overflow: hidden;
}
.progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold), var(--gold-hover));
    border-radius: 2px;
    transition: width 0.5s ease;
}

/* ─── Wizard Question ─── */
.wizard-step {
    animation: fadeInStep 0.4s ease;
}
@keyframes fadeInStep {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

/* ─── Upload Box ─── */
.upload-box {
    border: 2px dashed var(--border-color);
    padding: 30px;
    text-align: center;
    cursor: pointer;
    transition: all var(--transition);
    background: rgba(255,255,255,0.02);
    border-radius: var(--radius);
}
.upload-box:hover {
    border-color: var(--gold);
    background: var(--gold-dim);
}
.upload-box input { display: none; }
.upload-box i { font-size: 2rem; color: var(--text-muted); margin-bottom: 10px; }

/* ─── Contract ─── */
.contract-body {
    background: #fefefe;
    color: #1a1a1a;
    padding: 40px;
    border-radius: var(--radius);
    line-height: 2;
    font-size: 1.05rem;
}
.contract-body h3 {
    color: #333;
    margin: 20px 0 10px;
}

.contract-sign-section {
    background: #f8f6f0;
    padding: 24px;
    border-radius: var(--radius-sm);
    border-right: 4px solid var(--gold);
    margin-top: 24px;
}

/* ─── Timer ─── */
.timer-display {
    background: rgba(0,0,0,0.3);
    padding: 24px;
    border-radius: var(--radius);
    text-align: center;
    margin-top: 20px;
}
.timer-digits {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin: 16px 0;
}
.timer-unit {
    text-align: center;
}
.timer-unit .num {
    font-size: 2.2rem;
    font-weight: 800;
    color: var(--gold);
    display: block;
    line-height: 1;
}
.timer-unit .label {
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-top: 4px;
}

/* ─── Accordion ─── */
.accordion-item {
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    margin-bottom: 10px;
    overflow: hidden;
}
.accordion-header {
    width: 100%;
    padding: 16px 20px;
    background: var(--bg-lighter);
    border: none;
    color: var(--text-main);
    font-family: 'Cairo', sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    text-align: right;
    direction: rtl;
    transition: background var(--transition);
}
.accordion-header:hover { background: rgba(216,166,81,0.08); }
.accordion-header i { transition: transform var(--transition); }
.accordion-header.open i { transform: rotate(180deg); }
.accordion-body {
    padding: 16px 20px;
    border-top: 1px solid var(--border-color);
}

/* ─── Modal ─── */
.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    animation: fadeIn 0.2s ease;
}
.modal-content {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius);
    padding: 32px;
    width: 90%;
    max-width: 500px;
    max-height: 80vh;
    overflow-y: auto;
    box-shadow: var(--shadow);
    animation: scaleIn 0.3s ease;
}
.modal-title {
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--gold);
    margin-bottom: 20px;
}
@keyframes fadeIn { from { opacity:0 } to { opacity:1 } }
@keyframes scaleIn { from { opacity:0; transform:scale(0.95) } to { opacity:1; transform:scale(1) } }

/* ─── Start page ─── */
.start-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}
.start-content {
    text-align: center;
    max-width: 600px;
    padding: 40px 20px;
}
.start-logo {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: var(--gold-dim);
    color: var(--gold);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    margin: 0 auto 24px;
    border: 2px solid var(--border-active);
}
.start-content h1 {
    font-size: 2.2rem;
    margin-bottom: 12px;
}
.start-content p {
    color: var(--text-muted);
    margin-bottom: 30px;
    font-size: 1.05rem;
}

/* ─── Login Card ─── */
.login-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}
.login-card {
    width: 90%;
    max-width: 420px;
    padding: 40px;
}
.login-card h2 {
    text-align: center;
    margin-bottom: 8px;
}
.login-card p {
    text-align: center;
    color: var(--text-muted);
    margin-bottom: 30px;
}

/* ─── Search Bar ─── */
.search-bar {
    position: relative;
    margin-bottom: 20px;
}
.search-bar input {
    width: 100%;
    padding: 12px 16px 12px 44px;
    background: var(--bg-input);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    color: var(--white);
    font-family: 'Cairo', sans-serif;
    font-size: 0.95rem;
    transition: all var(--transition);
}
.search-bar input:focus {
    outline: none;
    border-color: var(--gold);
}
.search-bar i {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
}

/* ─── Answer Card (Admin View) ─── */
.answer-item {
    background: rgba(255,255,255,0.03);
    padding: 16px 20px;
    border-radius: var(--radius-sm);
    margin-bottom: 12px;
    border-right: 3px solid var(--gold);
}
.answer-item .q-text {
    font-weight: 700;
    color: var(--gold);
    margin-bottom: 8px;
    font-size: 0.95rem;
}
.answer-item .a-text {
    color: var(--text-main);
    font-size: 1rem;
}
.answer-item img {
    max-width: 100%;
    max-height: 300px;
    border-radius: var(--radius-sm);
    margin-top: 10px;
    border: 1px solid var(--border-color);
}

/* ─── Client Profile Header ─── */
.profile-header {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 8px;
}
.profile-avatar {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: var(--gold-dim);
    color: var(--gold);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.6rem;
    font-weight: 800;
    flex-shrink: 0;
    border: 2px solid var(--border-active);
}

/* ─── Responsive ─── */
@media (max-width: 768px) {
    .dashboard-header {
        flex-direction: column;
        gap: 16px;
        align-items: flex-start;
    }
    .header-actions {
        width: 100%;
        justify-content: flex-end;
    }
    .stats-grid {
        grid-template-columns: repeat(2, 1fr);
    }
    .client-list-item {
        flex-direction: column;
        gap: 12px;
        align-items: flex-start;
    }
    .tabs {
        overflow-x: auto;
    }
    .tab-btn {
        min-width: fit-content;
        flex: none;
        padding: 10px 16px;
    }
    .container {
        padding: 20px 16px;
    }
    .card {
        padding: 20px 16px;
    }
    .modal-content {
        padding: 24px 20px;
        width: 95%;
    }
    .start-content h1 {
        font-size: 1.6rem;
    }
    .timer-unit .num {
        font-size: 1.6rem;
    }
    .contract-body {
        padding: 24px 16px;
    }
    .profile-header {
        flex-direction: column;
        text-align: center;
    }
}

/* ─── Print Styles ─── */
@media print {
    body {
        background-color: white;
        color: black;
    }
    .gold-text { color: #333; }
    .no-print { display: none !important; }
    .card { border: none; background: transparent; }
    .contract-body { box-shadow: none; border: none; }
}

    </style>
</head>
<body>
    <div id="app"></div>
    <div id="toast-container"></div>
    <script>
// ══════════════════════════════════════════════════════
//  Media Buyer Portal — Complete App v2.0
// ══════════════════════════════════════════════════════

// ─── Default Database ───
const defaultDB = {
    config: {
        adminPassword: '01a80dzeA',
        adminName: 'الميديا باير',
        whatsapp: '',
        briefQuestions: [
            { id: 'q1', type: 'text', text: 'اسم البراند بالظبط، ونشاطه (إيه المنتجات اللي بتبيعها بالتحديد)', required: true },
            { id: 'q2', type: 'text', text: 'قصة البراند باختصار — إمتى اتأسس وليه بدأ أصلاً', required: true },
            { id: 'q3', type: 'text', text: 'إيه أكتر حاجة بتميزكم عن أي براند تاني بيبيع نفس المنتجات (USP)', required: true },
            { id: 'q4', type: 'radio', text: 'الوضع التشغيلي الحالي', options: ['فرع واحد', 'عدة فروع', 'أونلاين فقط'], required: true },
            { id: 'q5', type: 'text', text: 'روابط الحسابات الحالية (انستجرام، فيسبوك، تيك توك، إلخ)', required: false },
            { id: 'q6', type: 'file', text: 'ارفع اللوجو وصور للمنتجات (اختياري)', required: false }
        ],
        contractTerms: `البند الأول — نطاق العمل والخدمات
إعداد وتنفيذ الخطة الإعلانية الشهرية عبر المنصات المتفق عليها بين الطرفين.
إدارة الحملات الإعلانية ومتابعتها وتحسين أدائها بشكل مستمر.

البند الثاني — التزامات الطرف الثاني
تنفيذ الأعمال المتفق عليها بمهنية ووفقاً لأفضل الممارسات.
الحفاظ على سرية بيانات الطرف الأول وعدم استخدامها في غير أغراض هذا العقد.

البند الثالث — المدة
مدة هذا العقد شهر واحد تبدأ من تاريخ التوقيع وتجدد تلقائياً ما لم يخطر أحد الطرفين الآخر برغبته في عدم التجديد قبل 7 أيام من انتهاء المدة.

البند الرابع — السرية
يلتزم الطرف الثاني بالحفاظ على سرية جميع المعلومات والبيانات الخاصة بالطرف الأول.`,
        slots: [],
        invoiceItems: [
            { id: 'inv_default', name: 'إدارة حملات إعلانية', price: 0 }
        ]
    },
    clients: {}
};

// ─── Initialize DB ───
if (!localStorage.getItem('mb_db')) {
    localStorage.setItem('mb_db', JSON.stringify(defaultDB));
}
let db = JSON.parse(localStorage.getItem('mb_db'));

// Migration: add missing fields
if (!db.config.slots) db.config.slots = [];
if (!db.config.adminName) db.config.adminName = 'الميديا باير';
if (!db.config.whatsapp) db.config.whatsapp = '';
if (!db.config.invoiceItems) db.config.invoiceItems = defaultDB.config.invoiceItems;

Object.values(db.clients).forEach(c => {
    if (typeof c.meetingSlotId === 'undefined') c.meetingSlotId = null;
    if (typeof c.id === 'undefined') c.id = c.phone;
    if (typeof c.notes === 'undefined') c.notes = '';
    if (typeof c.invoiceAmount === 'undefined') c.invoiceAmount = null;
    if (typeof c.invoicePaid === 'undefined') c.invoicePaid = false;
    if (typeof c.createdAt === 'undefined') c.createdAt = Date.now();
    if (typeof c.status === 'undefined') {
        if (c.contractSigned) c.status = 'signed';
        else if (c.contractRevealed) c.status = 'contract-sent';
        else if (c.briefAnswers) c.status = 'brief-done';
        else if (c.name) c.status = 'registered';
        else c.status = 'new';
    }
});

const saveDB = () => localStorage.setItem('mb_db', JSON.stringify(db));

// ─── Toast System ───
const showToast = (message, type = 'success') => {
    const container = document.getElementById('toast-container');
    const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', info: 'fa-info-circle', warning: 'fa-exclamation-triangle' };
    const toast = document.createElement('div');
    toast.className = `toast toast-${type}`;
    toast.innerHTML = `<i class="fas ${icons[type]}"></i><span>${message}</span>`;
    container.appendChild(toast);
    setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3500);
};

// ─── Modal System ───
const showModal = (title, contentHtml, onConfirm) => {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
        <div class="modal-content">
            <h3 class="modal-title">${title}</h3>
            <div id="modalBody">${contentHtml}</div>
            <div style="display:flex; gap:10px; margin-top:24px; justify-content:flex-end;">
                <button class="btn" id="modalCancel">إلغاء</button>
                ${onConfirm ? '<button class="btn btn-primary" id="modalConfirm">تأكيد</button>' : ''}
            </div>
        </div>
    `;
    document.body.appendChild(overlay);
    overlay.querySelector('#modalCancel').onclick = () => overlay.remove();
    if (onConfirm) overlay.querySelector('#modalConfirm').onclick = () => { onConfirm(); overlay.remove(); };
    overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
    return overlay;
};

// ─── Helpers ───
const getInitials = (name) => {
    if (!name) return '?';
    const parts = name.trim().split(/\s+/);
    return parts.length >= 2 ? (parts[0][0] + parts[1][0]) : name.substring(0, 2);
};

const getStatusBadge = (client) => {
    if (client.contractSigned) return '<span class="badge badge-success"><i class="fas fa-check"></i> وقّع العقد</span>';
    if (client.contractRevealed) return '<span class="badge badge-warning"><i class="fas fa-file-signature"></i> بانتظار التوقيع</span>';
    if (client.meetingSlotId) return '<span class="badge badge-info"><i class="fas fa-calendar-check"></i> حجز ميتينج</span>';
    if (client.briefAnswers) return '<span class="badge badge-info"><i class="fas fa-clipboard-check"></i> أرسل البريف</span>';
    if (client.name) return '<span class="badge badge-warning"><i class="fas fa-user"></i> سجّل بياناته</span>';
    return '<span class="badge badge-danger"><i class="fas fa-clock"></i> لم يبدأ بعد</span>';
};

const formatDate = (d) => new Date(d).toLocaleDateString('ar-EG', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
const formatTime = (d) => new Date(d).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
const formatDateTime = (d) => new Date(d).toLocaleString('ar-EG', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' });

const playAlertSound = () => {
    const audio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
    audio.play().catch(() => {});
};

// ─── Core Router ───
const navigate = () => {
    if (window.meetingInterval) clearInterval(window.meetingInterval);
    if (window.adminInterval) clearInterval(window.adminInterval);

    const hash = window.location.hash || '#start';
    const app = document.getElementById('app');

    if (hash === '#admin') renderAdminLogin(app);
    else if (hash === '#dashboard') { renderAdminDashboard(app); startAdminAlerts(); }
    else if (hash.startsWith('#admin/client/')) { renderAdminClientView(app, hash.split('/')[2]); startAdminAlerts(); }
    else if (hash.startsWith('#client/')) renderClientApp(app, hash.split('/')[1]);
    else renderStart(app);
};

window.addEventListener('hashchange', navigate);

// ─── Admin Alerts ───
const startAdminAlerts = () => {
    if (window.adminInterval) clearInterval(window.adminInterval);
    window.adminInterval = setInterval(() => {
        const now = Date.now();
        let changed = false;
        db.config.slots.forEach(s => {
            if (s.status === 'booked') {
                const mTime = new Date(s.dateTime).getTime();
                const diff = mTime - now;
                const c = Object.values(db.clients).find(x => x.phone === s.bookedByPhone || x.id === s.bookedByPhone);
                const cName = c && c.name ? c.name : 'عميل';
                if (!s.alerted10 && diff <= 10 * 60 * 1000 && diff > 0) {
                    s.alerted10 = true; changed = true; playAlertSound();
                    showToast(`يتبقى 10 دقائق على ميتينج العميل (${cName})`, 'warning');
                }
                if (!s.alertedNow && diff <= 0 && diff > -5 * 60 * 1000) {
                    s.alertedNow = true; changed = true; playAlertSound();
                    showToast(`الميتينج بدأ الآن مع العميل (${cName})!`, 'error');
                }
            }
        });
        if (changed) saveDB();
    }, 15000);
};

// ══════════════════════════════════════════════════════
//  VIEWS
// ══════════════════════════════════════════════════════

// ─── Start Page ───
const renderStart = (app) => {
    app.innerHTML = `
        <div class="start-page">
            <div class="start-content">
                <div class="start-logo"><i class="fas fa-bullhorn"></i></div>
                <h1>مرحباً بك في <span class="gold-text">نظام إدارة العملاء</span></h1>
                <p>نظام متكامل لإدارة عملاء الميديا باينج — من البريف للميتينج للعقد</p>
                <button onclick="window.location.hash='#admin'" class="btn btn-primary" style="padding:14px 40px; font-size:1.1rem;">
                    <i class="fas fa-lock"></i> دخول لوحة التحكم
                </button>
            </div>
        </div>
    `;
};

// ─── Admin Login ───
const renderAdminLogin = (app) => {
    app.innerHTML = `
        <div class="login-page">
            <div class="card login-card">
                <div style="text-align:center; margin-bottom:24px;">
                    <div class="start-logo" style="margin: 0 auto 16px;"><i class="fas fa-shield-halved"></i></div>
                    <h2 class="gold-text">تسجيل الدخول</h2>
                    <p>أدخل كلمة المرور للوصول للوحة التحكم</p>
                </div>
                <div class="form-group">
                    <label class="form-label"><i class="fas fa-key"></i> كلمة المرور</label>
                    <input type="password" id="adminPass" class="form-input" placeholder="أدخل كلمة المرور..." onkeypress="if(event.key==='Enter')login()">
                    <p id="loginErr" class="text-danger hidden" style="margin-top:8px; font-size:0.9rem;"><i class="fas fa-exclamation-triangle"></i> كلمة المرور غير صحيحة</p>
                </div>
                <button onclick="login()" class="btn btn-primary" style="width:100%; padding:14px;">
                    <i class="fas fa-sign-in-alt"></i> دخول
                </button>
            </div>
        </div>
    `;
    window.login = () => {
        if (document.getElementById('adminPass').value === db.config.adminPassword) {
            sessionStorage.setItem('admin_logged_in', 'true');
            window.location.hash = '#dashboard';
        } else {
            document.getElementById('loginErr').classList.remove('hidden');
            document.getElementById('adminPass').style.borderColor = 'var(--danger)';
        }
    };
};

// ─── Admin Dashboard ───
const renderAdminDashboard = (app) => {
    if (sessionStorage.getItem('admin_logged_in') !== 'true') { window.location.hash = '#admin'; return; }

    const clients = Object.values(db.clients);
    const ids = Object.keys(db.clients);

    // Stats
    const totalClients = clients.length;
    const briefsDone = clients.filter(c => c.briefAnswers).length;
    const meetingsBooked = clients.filter(c => c.meetingSlotId).length;
    const contractsSigned = clients.filter(c => c.contractSigned).length;
    const pendingBriefs = clients.filter(c => c.name && !c.briefAnswers).length;

    // Today's meetings alert
    const todayStr = new Date().toDateString();
    const todayMeetings = db.config.slots.filter(s => s.status === 'booked' && new Date(s.dateTime).toDateString() === todayStr);
    if (todayMeetings.length > 0 && !sessionStorage.getItem('admin_notified')) {
        setTimeout(() => showToast(`لديك ${todayMeetings.length} ميتينج اليوم!`, 'warning'), 500);
        sessionStorage.setItem('admin_notified', 'true');
    }

    // Clients HTML
    let clientsHtml = '';
    if (ids.length === 0) {
        clientsHtml = `
            <div class="empty-state">
                <i class="fas fa-users"></i>
                <p>لا يوجد عملاء حتى الآن<br><span class="text-muted">أنشئ رابط عميل جديد للبدء</span></p>
            </div>`;
    } else {
        ids.forEach(id => {
            const c = db.clients[id];
            const name = c.name || 'لم يسجل بعد';
            const initials = getInitials(c.name);
            const isUnregistered = !c.name;
            clientsHtml += `
                <div class="client-list-item" data-name="${c.name||''}" data-phone="${c.phone||''}" onclick="window.location.hash='#admin/client/${id}'">
                    <div class="client-info">
                        <div class="client-avatar">${isUnregistered ? '<i class="fas fa-user-clock" style="font-size:0.9rem;"></i>' : initials}</div>
                        <div>
                            <div class="client-name" ${isUnregistered ? 'style="color:var(--text-muted)"' : ''}>${name}</div>
                            <div class="client-phone">${c.phone || '—'}</div>
                        </div>
                    </div>
                    <div class="client-badges">${getStatusBadge(c)}</div>
                </div>
            `;
        });
    }

    // Slots grouped by day
    const slotsGrouped = {};
    db.config.slots.forEach(s => {
        const dateStr = formatDate(s.dateTime);
        if (!slotsGrouped[dateStr]) slotsGrouped[dateStr] = [];
        slotsGrouped[dateStr].push(s);
    });

    let slotsHtml = '';
    if (Object.keys(slotsGrouped).length === 0) {
        slotsHtml = `
            <div class="empty-state">
                <i class="fas fa-calendar-alt"></i>
                <p>لا توجد مواعيد مضافة حالياً</p>
            </div>`;
    } else {
        Object.keys(slotsGrouped).forEach(date => {
            slotsGrouped[date].sort((a, b) => new Date(a.dateTime) - new Date(b.dateTime));
            let timesHtml = slotsGrouped[date].map(s => {
                let clientName = '<span class="text-success"><i class="fas fa-check-circle"></i> متاح</span>';
                if (s.status === 'booked') {
                    const c = Object.values(db.clients).find(x => x.phone === s.bookedByPhone || x.id === s.bookedByPhone);
                    clientName = `<span class="text-danger"><i class="fas fa-user"></i> ${c && c.name ? c.name : 'محجوز'}</span>`;
                }
                let delBtn = s.status === 'available' ? `<button class="btn btn-danger btn-sm" onclick="event.stopPropagation(); deleteSlot('${s.id}')"><i class="fas fa-trash"></i></button>` : '';
                return `
                    <div class="slot-item">
                        <div>
                            <span class="slot-time">${formatTime(s.dateTime)}</span>
                            <span class="slot-link" style="margin-right:12px;">${s.link ? '<i class="fas fa-link"></i>' : ''}</span><br>
                            ${clientName}
                        </div>
                        <div>${delBtn}</div>
                    </div>`;
            }).join('');

            slotsHtml += `
                <div class="slot-day-group">
                    <button class="slot-day-header" onclick="this.nextElementSibling.classList.toggle('hidden'); this.querySelector('i').classList.toggle('fa-chevron-down'); this.querySelector('i').classList.toggle('fa-chevron-up');">
                        <span><i class="fas fa-calendar-day" style="margin-left:8px;"></i> ${date}</span>
                        <i class="fas fa-chevron-down"></i>
                    </button>
                    <div>${timesHtml}</div>
                </div>
            `;
        });
    }

    // Questions list
    let questionsHtml = db.config.briefQuestions.map((q, i) => {
        const typeLabels = { text: 'نص', file: 'ملف', radio: 'اختيارات' };
        return `
            <div style="display:flex; justify-content:space-between; align-items:center; padding:14px 16px; background:var(--bg-lighter); border-radius:var(--radius-sm); margin-bottom:8px; border:1px solid var(--border-color);">
                <div style="flex:1;">
                    <span class="gold-text" style="font-weight:700;">${i + 1}.</span> ${q.text}
                    <div style="margin-top:4px;">
                        <span class="badge badge-info">${typeLabels[q.type] || q.type}</span>
                        ${q.required ? '<span class="badge badge-warning">إجباري</span>' : '<span class="badge" style="background:var(--bg-input); color:var(--text-muted);">اختياري</span>'}
                    </div>
                </div>
                <button class="btn btn-danger btn-sm" onclick="deleteQuestion('${q.id}')"><i class="fas fa-trash"></i></button>
            </div>`;
    }).join('');

    app.innerHTML = `
        <div class="container">
            <!-- Header -->
            <div class="dashboard-header">
                <h1><i class="fas fa-chart-line gold-text"></i> لوحة التحكم</h1>
                <div class="header-actions">
                    <button onclick="exportData()" class="btn btn-sm btn-ghost" title="تصدير البيانات"><i class="fas fa-download"></i></button>
                    <button onclick="showSettingsModal()" class="btn btn-sm btn-ghost" title="الإعدادات"><i class="fas fa-cog"></i></button>
                    <button onclick="window.location.hash='#start'; sessionStorage.removeItem('admin_logged_in');" class="btn btn-sm btn-danger">
                        <i class="fas fa-sign-out-alt"></i> خروج
                    </button>
                </div>
            </div>

            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon gold"><i class="fas fa-users"></i></div>
                    <div class="stat-number">${totalClients}</div>
                    <div class="stat-label">إجمالي العملاء</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon blue"><i class="fas fa-clipboard-check"></i></div>
                    <div class="stat-number">${briefsDone}</div>
                    <div class="stat-label">أكملوا البريف</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon green"><i class="fas fa-calendar-check"></i></div>
                    <div class="stat-number">${meetingsBooked}</div>
                    <div class="stat-label">حجزوا ميتينج</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon red"><i class="fas fa-file-signature"></i></div>
                    <div class="stat-number">${contractsSigned}</div>
                    <div class="stat-label">وقّعوا العقد</div>
                </div>
            </div>

            ${pendingBriefs > 0 ? `<div style="background:var(--gold-dim); border:1px solid var(--border-active); border-radius:var(--radius-sm); padding:14px 20px; margin-bottom:20px; display:flex; align-items:center; gap:10px;">
                <i class="fas fa-bell gold-text"></i>
                <span>${pendingBriefs} عميل سجّل بياناته ولم يكمل البريف بعد</span>
            </div>` : ''}

            <!-- Tabs -->
            <div class="tabs">
                <button class="tab-btn active" onclick="switchDashTab('clients')" id="dtab_clients">
                    <i class="fas fa-users"></i> العملاء <span class="badge-count">${totalClients}</span>
                </button>
                <button class="tab-btn" onclick="switchDashTab('meetings')" id="dtab_meetings">
                    <i class="fas fa-calendar-alt"></i> المواعيد
                </button>
                <button class="tab-btn" onclick="switchDashTab('contract')" id="dtab_contract">
                    <i class="fas fa-file-contract"></i> العقد
                </button>
                <button class="tab-btn" onclick="switchDashTab('questions')" id="dtab_questions">
                    <i class="fas fa-question-circle"></i> الأسئلة
                </button>
            </div>

            <!-- Clients Tab -->
            <div id="dash_clients">
                <div class="card">
                    <div class="card-header">
                        <h2 class="gold-text" style="margin:0;"><i class="fas fa-address-book"></i> ملفات العملاء</h2>
                        <button onclick="generateClientLink()" class="btn btn-primary btn-sm"><i class="fas fa-plus"></i> إنشاء رابط عميل</button>
                    </div>
                    <div class="search-bar">
                        <input type="text" placeholder="بحث بالاسم أو رقم الهاتف..." onkeyup="filterClients(this.value)">
                        <i class="fas fa-search"></i>
                    </div>
                    <div id="clientsList">${clientsHtml}</div>
                </div>
            </div>

            <!-- Meetings Tab -->
            <div id="dash_meetings" class="hidden">
                <div class="card">
                    <div class="card-header">
                        <h2 class="gold-text" style="margin:0;"><i class="fas fa-calendar-plus"></i> إدارة مواعيد الميتينج</h2>
                    </div>
                    <div style="display:grid; grid-template-columns: 1fr 1fr auto; gap:12px; align-items:end; margin-bottom:24px; background:var(--bg-lighter); padding:20px; border-radius:var(--radius-sm);">
                        <div>
                            <label class="form-label" style="font-size:0.85rem;"><i class="fas fa-clock"></i> التاريخ والوقت</label>
                            <input type="datetime-local" id="newSlotTime" class="form-input">
                        </div>
                        <div>
                            <label class="form-label" style="font-size:0.85rem;"><i class="fas fa-link"></i> رابط الميتينج</label>
                            <input type="url" id="newSlotLink" class="form-input" placeholder="https://meet.google.com/...">
                        </div>
                        <button onclick="addSlot()" class="btn btn-primary" style="height:46px;"><i class="fas fa-plus"></i> إضافة</button>
                    </div>
                    <div>${slotsHtml}</div>
                </div>
            </div>

            <!-- Contract Tab -->
            <div id="dash_contract" class="hidden">
                <div class="card">
                    <div class="card-header">
                        <h2 class="gold-text" style="margin:0;"><i class="fas fa-file-contract"></i> إعدادات العقد</h2>
                    </div>
                    <div class="form-group">
                        <label class="form-label">اسمك أو اسم وكالتك (الطرف الثاني)</label>
                        <input type="text" id="adminNameInput" class="form-input" value="${db.config.adminName}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">بنود العقد الأساسية</label>
                        <textarea id="contractTermsInput" class="form-input form-textarea" style="min-height:250px;">${db.config.contractTerms}</textarea>
                    </div>
                    <button onclick="saveContractSettings()" class="btn btn-primary"><i class="fas fa-save"></i> حفظ الإعدادات</button>
                </div>
            </div>

            <!-- Questions Tab -->
            <div id="dash_questions" class="hidden">
                <div class="card">
                    <div class="card-header">
                        <h2 class="gold-text" style="margin:0;"><i class="fas fa-list-ol"></i> أسئلة البريف</h2>
                        <button onclick="showAddQuestionModal()" class="btn btn-primary btn-sm"><i class="fas fa-plus"></i> إضافة سؤال</button>
                    </div>
                    <div>${questionsHtml}</div>
                </div>
            </div>
        </div>
    `;

    // ─── Dashboard Functions ───
    window.switchDashTab = (tab) => {
        ['clients', 'meetings', 'contract', 'questions'].forEach(t => {
            const el = document.getElementById('dash_' + t);
            const btn = document.getElementById('dtab_' + t);
            if (el) el.classList.add('hidden');
            if (btn) btn.classList.remove('active');
        });
        document.getElementById('dash_' + tab)?.classList.remove('hidden');
        document.getElementById('dtab_' + tab)?.classList.add('active');
    };

    window.filterClients = (val) => {
        const q = val.toLowerCase();
        document.querySelectorAll('.client-list-item').forEach(el => {
            const name = (el.getAttribute('data-name') || '').toLowerCase();
            const phone = (el.getAttribute('data-phone') || '').toLowerCase();
            el.style.display = (name.includes(q) || phone.includes(q)) ? 'flex' : 'none';
        });
    };

    window.generateClientLink = () => {
        const id = 'C' + Math.floor(Math.random() * 1000000);
        db.clients[id] = {
            id, name: '', phone: '', briefAnswers: null,
            contractRevealed: false, contractSigned: false,
            meetingSlotId: null, notes: '', invoiceAmount: null,
            invoicePaid: false, createdAt: Date.now(), status: 'new'
        };
        saveDB();
        const link = window.location.origin + window.location.pathname + '#client/' + id;

        showModal('تم إنشاء رابط العميل!', `
            <p style="margin-bottom:16px;">انسخ الرابط التالي وأرسله للعميل:</p>
            <div style="background:var(--bg-lighter); padding:14px; border-radius:var(--radius-sm); direction:ltr; word-break:break-all; font-size:0.9rem; border:1px solid var(--border-active); margin-bottom:16px;">
                <code id="clientLinkText">${link}</code>
            </div>
            <button class="btn btn-primary" style="width:100%;" onclick="navigator.clipboard.writeText('${link}'); showToast('تم نسخ الرابط!', 'success');">
                <i class="fas fa-copy"></i> نسخ الرابط
            </button>
            ${db.config.whatsapp ? '' : `
            <div style="margin-top:12px;">
                <a href="https://wa.me/?text=${encodeURIComponent('مرحباً! برجاء تعبئة البريف من خلال الرابط التالي:\n' + link)}" target="_blank" class="btn" style="width:100%; justify-content:center; background:rgba(37,211,102,0.15); color:#25d366; border-color:#25d366;">
                    <i class="fab fa-whatsapp"></i> إرسال عبر واتساب
                </a>
            </div>`}
        `);
        renderAdminDashboard(document.getElementById('app'));
    };

    window.saveContractSettings = () => {
        db.config.adminName = document.getElementById('adminNameInput').value;
        db.config.contractTerms = document.getElementById('contractTermsInput').value;
        saveDB();
        showToast('تم حفظ إعدادات العقد بنجاح!', 'success');
    };

    window.showAddQuestionModal = () => {
        showModal('إضافة سؤال جديد', `
            <div class="form-group">
                <label class="form-label">نوع السؤال</label>
                <select id="mqType" class="form-input form-select">
                    <option value="text">إجابة نصية</option>
                    <option value="file">رفع ملف/صورة</option>
                    <option value="radio">اختيارات متعددة</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">نص السؤال</label>
                <input type="text" id="mqText" class="form-input" placeholder="اكتب السؤال هنا...">
            </div>
            <div class="form-group hidden" id="mqOptionsGroup">
                <label class="form-label">الاختيارات (مفصولة بفاصلة)</label>
                <input type="text" id="mqOptions" class="form-input" placeholder="اختيار 1, اختيار 2, اختيار 3">
            </div>
            <div class="form-group">
                <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
                    <input type="checkbox" id="mqRequired" checked> سؤال إجباري
                </label>
            </div>
        `, () => {
            const text = document.getElementById('mqText').value;
            if (!text) return showToast('يجب كتابة نص السؤال!', 'error');
            const type = document.getElementById('mqType').value;
            let options = [];
            if (type === 'radio') {
                options = document.getElementById('mqOptions').value.split(',').map(o => o.trim()).filter(Boolean);
                if (options.length < 2) return showToast('يجب إضافة اختيارين على الأقل!', 'error');
            }
            db.config.briefQuestions.push({
                id: 'q_' + Date.now(), type, text,
                required: document.getElementById('mqRequired').checked,
                options
            });
            saveDB();
            showToast('تم إضافة السؤال بنجاح!', 'success');
            renderAdminDashboard(document.getElementById('app'));
        });

        // Toggle options field
        document.getElementById('mqType').addEventListener('change', function () {
            document.getElementById('mqOptionsGroup').classList.toggle('hidden', this.value !== 'radio');
        });
    };

    window.deleteQuestion = (id) => {
        showModal('تأكيد الحذف', '<p>هل أنت متأكد من حذف هذا السؤال؟</p>', () => {
            db.config.briefQuestions = db.config.briefQuestions.filter(q => q.id !== id);
            saveDB();
            showToast('تم حذف السؤال', 'success');
            renderAdminDashboard(document.getElementById('app'));
        });
    };

    window.addSlot = () => {
        const time = document.getElementById('newSlotTime').value;
        const link = document.getElementById('newSlotLink').value;
        if (!time) return showToast('برجاء تحديد الوقت', 'error');
        if (!link) return showToast('برجاء إضافة رابط الميتينج', 'error');
        db.config.slots.push({ id: 'slot_' + Date.now(), dateTime: time, link, status: 'available', bookedByPhone: null });
        saveDB();
        showToast('تم إضافة الميعاد بنجاح!', 'success');
        renderAdminDashboard(document.getElementById('app'));
        switchDashTab('meetings');
    };

    window.deleteSlot = (id) => {
        showModal('تأكيد الحذف', '<p>هل أنت متأكد من حذف هذا الميعاد؟</p>', () => {
            db.config.slots = db.config.slots.filter(s => s.id !== id);
            saveDB();
            showToast('تم حذف الميعاد', 'success');
            renderAdminDashboard(document.getElementById('app'));
            switchDashTab('meetings');
        });
    };

    window.showSettingsModal = () => {
        showModal('إعدادات النظام', `
            <div class="form-group">
                <label class="form-label"><i class="fas fa-key"></i> تغيير كلمة المرور</label>
                <input type="password" id="setNewPass" class="form-input" placeholder="كلمة المرور الجديدة">
            </div>
            <div class="form-group">
                <label class="form-label"><i class="fab fa-whatsapp"></i> رقم واتساب (اختياري)</label>
                <input type="text" id="setWhatsapp" class="form-input" value="${db.config.whatsapp}" placeholder="مثال: 201234567890">
            </div>
        `, () => {
            const np = document.getElementById('setNewPass').value;
            if (np) { db.config.adminPassword = np; showToast('تم تغيير كلمة المرور', 'success'); }
            db.config.whatsapp = document.getElementById('setWhatsapp').value;
            saveDB();
            showToast('تم حفظ الإعدادات', 'success');
        });
    };

    window.exportData = () => {
        let csv = 'الاسم,الهاتف,البريف,الميتينج,العقد\n';
        Object.values(db.clients).forEach(c => {
            csv += `"${c.name || ''}","${c.phone || ''}","${c.briefAnswers ? 'نعم' : 'لا'}","${c.meetingSlotId ? 'نعم' : 'لا'}","${c.contractSigned ? 'نعم' : 'لا'}"\n`;
        });
        const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'clients_export.csv'; a.click();
        URL.revokeObjectURL(url);
        showToast('تم تصدير البيانات بنجاح!', 'success');
    };
};

// ─── Admin Client View ───
const renderAdminClientView = (app, id) => {
    if (sessionStorage.getItem('admin_logged_in') !== 'true') return navigate();
    const client = db.clients[id];
    if (!client) { showToast('العميل غير موجود', 'error'); window.location.hash = '#dashboard'; return; }

    const nameDisplay = client.name || 'لم يسجل بياناته بعد';
    const initials = getInitials(client.name);

    // Answers
    let answersHtml = `<div class="empty-state"><i class="fas fa-clipboard"></i><p>العميل لم يرسل البريف بعد</p></div>`;
    if (client.briefAnswers) {
        answersHtml = db.config.briefQuestions.map(q => {
            let val = client.briefAnswers[q.id];
            let displayVal = val || '<span class="text-muted">لم يجب</span>';
            if (val && val.startsWith('data:image')) {
                displayVal = `<img src="${val}" alt="مرفق">`;
            } else if (val && val.startsWith('data:')) {
                displayVal = `<a href="${val}" download="ملف_مرفق" class="btn btn-sm"><i class="fas fa-download"></i> تحميل الملف</a>`;
            }
            return `<div class="answer-item"><div class="q-text"><i class="fas fa-question-circle"></i> ${q.text}</div><div class="a-text">${displayVal}</div></div>`;
        }).join('');
    }

    // Meeting
    let meetingHtml = '<p class="text-muted"><i class="fas fa-calendar-times"></i> لم يحجز ميتينج بعد</p>';
    if (client.meetingSlotId) {
        const s = db.config.slots.find(x => x.id === client.meetingSlotId);
        if (s) {
            meetingHtml = `
                <div style="display:flex; gap:20px; flex-wrap:wrap;">
                    <div style="flex:1;">
                        <p><strong><i class="fas fa-calendar"></i> الموعد:</strong> <span class="text-success">${formatDateTime(s.dateTime)}</span></p>
                        <p style="margin-top:8px;"><strong><i class="fas fa-link"></i> الرابط:</strong> <a href="${s.link}" target="_blank">${s.link}</a></p>
                    </div>
                </div>`;
        }
    }

    // Contract
    let contractHtml = '';
    if (client.contractSigned) {
        contractHtml = '<div style="display:flex; align-items:center; gap:10px;"><i class="fas fa-check-circle text-success" style="font-size:1.5rem;"></i><span class="text-success" style="font-weight:700; font-size:1.1rem;">تم توقيع العقد بنجاح!</span></div>';
    } else if (client.contractRevealed) {
        contractHtml = '<div style="display:flex; align-items:center; gap:10px;"><i class="fas fa-hourglass-half gold-text" style="font-size:1.5rem;"></i><span class="gold-text" style="font-weight:700;">العقد ظاهر للعميل — بانتظار توقيعه</span></div>';
    } else {
        contractHtml = `
            <p class="text-muted" style="margin-bottom:16px;">العقد مخفي عن العميل حالياً</p>
            <button onclick="revealContract('${id}')" class="btn btn-primary"><i class="fas fa-eye"></i> إظهار العقد للعميل الآن</button>
        `;
    }

    // Notes
    const notesVal = client.notes || '';

    app.innerHTML = `
        <div class="container">
            <div class="no-print" style="margin-bottom:20px; display:flex; justify-content:space-between; align-items:center;">
                <button onclick="window.location.hash='#dashboard'" class="btn btn-ghost"><i class="fas fa-arrow-right"></i> العودة للوحة التحكم</button>
                <button onclick="deleteClientFromProfile('${id}')" class="btn btn-danger btn-sm"><i class="fas fa-trash"></i> حذف العميل</button>
            </div>

            <!-- Profile Header -->
            <div class="card" style="margin-bottom:20px;">
                <div class="profile-header">
                    <div class="profile-avatar">${client.name ? initials : '<i class="fas fa-user"></i>'}</div>
                    <div style="flex:1;">
                        <h1 style="margin:0; font-size:1.5rem;" ${!client.name ? 'class="text-muted"' : ''}>${nameDisplay}</h1>
                        <p class="text-muted" style="margin:4px 0;">${client.phone || 'لا يوجد رقم هاتف'}</p>
                        ${getStatusBadge(client)}
                    </div>
                    <div class="no-print">
                        <a href="#client/${id}" target="_blank" class="btn btn-sm"><i class="fas fa-external-link-alt"></i> صفحة العميل</a>
                    </div>
                </div>
            </div>

            <!-- Tabs -->
            <div class="tabs no-print">
                <button class="tab-btn active" onclick="switchClientTab('brief')" id="ctab_brief"><i class="fas fa-clipboard-list"></i> البريف</button>
                <button class="tab-btn" onclick="switchClientTab('meeting')" id="ctab_meeting"><i class="fas fa-video"></i> الميتينج</button>
                <button class="tab-btn" onclick="switchClientTab('contract')" id="ctab_contract"><i class="fas fa-file-signature"></i> العقد</button>
                <button class="tab-btn" onclick="switchClientTab('notes')" id="ctab_notes"><i class="fas fa-sticky-note"></i> ملاحظات</button>
            </div>

            <!-- Brief -->
            <div id="cview_brief">
                <div class="card">
                    <h2 class="gold-text" style="margin-bottom:20px;"><i class="fas fa-clipboard-check"></i> إجابات البريف</h2>
                    ${answersHtml}
                </div>
            </div>

            <!-- Meeting -->
            <div id="cview_meeting" class="hidden">
                <div class="card">
                    <h2 class="gold-text" style="margin-bottom:20px;"><i class="fas fa-calendar-check"></i> حالة الميتينج</h2>
                    ${meetingHtml}
                </div>
            </div>

            <!-- Contract -->
            <div id="cview_contract" class="hidden">
                <div class="card">
                    <h2 class="gold-text" style="margin-bottom:20px;"><i class="fas fa-file-contract"></i> حالة العقد</h2>
                    ${contractHtml}
                </div>
            </div>

            <!-- Notes -->
            <div id="cview_notes" class="hidden">
                <div class="card">
                    <h2 class="gold-text" style="margin-bottom:20px;"><i class="fas fa-sticky-note"></i> ملاحظات خاصة</h2>
                    <textarea id="clientNotes" class="form-input form-textarea" placeholder="اكتب ملاحظاتك عن هذا العميل هنا...">${notesVal}</textarea>
                    <button onclick="saveClientNotes('${id}')" class="btn btn-primary" style="margin-top:16px;"><i class="fas fa-save"></i> حفظ الملاحظات</button>
                </div>
            </div>
        </div>
    `;

    window.switchClientTab = (tab) => {
        ['brief', 'meeting', 'contract', 'notes'].forEach(t => {
            document.getElementById('cview_' + t)?.classList.add('hidden');
            document.getElementById('ctab_' + t)?.classList.remove('active');
        });
        document.getElementById('cview_' + tab)?.classList.remove('hidden');
        document.getElementById('ctab_' + tab)?.classList.add('active');
    };

    window.revealContract = (cid) => {
        db.clients[cid].contractRevealed = true;
        saveDB();
        showToast('تم إظهار العقد للعميل', 'success');
        renderAdminClientView(document.getElementById('app'), cid);
    };

    window.deleteClientFromProfile = (cid) => {
        showModal('تأكيد الحذف', '<p style="color:var(--danger);">هل أنت متأكد من حذف هذا العميل وجميع بياناته نهائياً؟ لا يمكن التراجع عن هذا الإجراء.</p>', () => {
            // Free up any booked slots
            const cl = db.clients[cid];
            if (cl && cl.meetingSlotId) {
                const slot = db.config.slots.find(s => s.id === cl.meetingSlotId);
                if (slot) { slot.status = 'available'; slot.bookedByPhone = null; }
            }
            delete db.clients[cid];
            saveDB();
            showToast('تم حذف العميل', 'success');
            window.location.hash = '#dashboard';
        });
    };

    window.saveClientNotes = (cid) => {
        db.clients[cid].notes = document.getElementById('clientNotes').value;
        saveDB();
        showToast('تم حفظ الملاحظات', 'success');
    };
};

// ══════════════════════════════════════════════════════
//  CLIENT-FACING APP
// ══════════════════════════════════════════════════════
const renderClientApp = (app, id) => {
    const client = db.clients[id];
    if (!client) {
        app.innerHTML = `
            <div class="start-page">
                <div class="start-content">
                    <div class="start-logo" style="border-color:var(--danger);"><i class="fas fa-exclamation-triangle" style="color:var(--danger);"></i></div>
                    <h2>عذراً، هذا الرابط غير صحيح أو تم حذفه</h2>
                    <p class="text-muted">تواصل مع الميديا باير للحصول على رابط جديد</p>
                </div>
            </div>`;
        return;
    }

    // ─── Registration ───
    if (!client.name || !client.phone) {
        app.innerHTML = `
            <div class="login-page">
                <div class="card login-card">
                    <div style="text-align:center; margin-bottom:24px;">
                        <div class="start-logo" style="margin:0 auto 16px;"><i class="fas fa-user-plus"></i></div>
                        <h2 class="gold-text">مرحباً بك!</h2>
                        <p class="text-muted">برجاء إدخال بياناتك للبدء</p>
                    </div>
                    <div class="form-group">
                        <label class="form-label"><i class="fas fa-user"></i> الاسم الكريم / اسم الشركة</label>
                        <input type="text" id="regName" class="form-input" placeholder="مثال: شركة النخبة">
                    </div>
                    <div class="form-group">
                        <label class="form-label"><i class="fas fa-phone"></i> رقم الهاتف</label>
                        <input type="tel" id="regPhone" class="form-input" placeholder="مثال: 01012345678" style="direction:ltr; text-align:right;">
                    </div>
                    <button onclick="registerClient('${id}')" class="btn btn-primary" style="width:100%; padding:14px;">
                        <i class="fas fa-arrow-left"></i> ابدأ الآن
                    </button>
                </div>
            </div>`;

        window.registerClient = (cid) => {
            const n = document.getElementById('regName').value.trim();
            const p = document.getElementById('regPhone').value.trim();
            if (!n || !p) return showToast('الرجاء إدخال الاسم ورقم الهاتف', 'error');
            db.clients[cid].name = n;
            db.clients[cid].phone = p;
            db.clients[cid].status = 'registered';
            saveDB();
            renderClientApp(document.getElementById('app'), cid);
        };
        return;
    }

    // ─── Tabs ───
    const hasBrief = !!client.briefAnswers;
    const hasContract = client.contractRevealed;

    let meetingBtnHtml = hasBrief ? `<button class="tab-btn" onclick="showClientTab('meeting')" id="cbtn_meeting"><i class="fas fa-calendar-alt"></i> الميتينج</button>` : '';
    let contractBtnHtml = hasContract ? `<button class="tab-btn" onclick="showClientTab('contract')" id="cbtn_contract"><i class="fas fa-file-signature"></i> العقد</button>` : '';

    // ─── Brief Wizard ───
    const totalQ = db.config.briefQuestions.length;
    let questionsHtml = '';
    db.config.briefQuestions.forEach((q, index) => {
        let inputHtml = '';
        const val = client.briefAnswers ? (client.briefAnswers[q.id] || '') : '';
        const readonly = client.briefAnswers ? 'readonly disabled' : '';
        const requiredAttr = q.required ? 'required' : '';

        if (q.type === 'text') {
            inputHtml = `<input type="text" id="${q.id}" class="form-input" value="${val}" ${readonly} ${requiredAttr} placeholder="اكتب إجابتك هنا...">`;
        } else if (q.type === 'file') {
            if (client.briefAnswers && val) {
                if (val.startsWith('data:image')) inputHtml = `<img src="${val}" style="max-width:100%; border-radius:var(--radius-sm);">`;
                else inputHtml = '<p class="text-success"><i class="fas fa-check-circle"></i> تم رفع الملف</p>';
            } else {
                inputHtml = `
                    <div class="upload-box" onclick="document.getElementById('${q.id}').click()">
                        <input type="file" id="${q.id}" accept="image/*,.pdf,.doc,.docx" onchange="handleFilePreview(this, '${q.id}')">
                        <i class="fas fa-cloud-upload-alt"></i>
                        <p class="text-muted">اضغط لرفع ملف أو صورة</p>
                        <p class="text-muted" style="font-size:0.8rem;">الحد الأقصى 2 ميجا</p>
                    </div>
                    <div id="preview_${q.id}" style="margin-top:10px; display:none;" class="text-success"></div>`;
            }
        } else if (q.type === 'radio') {
            inputHtml = '<div style="display:flex; flex-direction:column; gap:10px; margin-top:10px;">';
            (q.options || []).forEach(opt => {
                const checked = val === opt ? 'checked' : '';
                inputHtml += `
                    <label style="display:flex; align-items:center; gap:12px; padding:14px 16px; background:var(--bg-input); border:1px solid var(--border-color); border-radius:var(--radius-sm); cursor:pointer; transition: all var(--transition);" onmouseover="this.style.borderColor='var(--border-active)'" onmouseout="this.style.borderColor='var(--border-color)'">
                        <input type="radio" name="${q.id}" value="${opt}" ${readonly} ${checked} style="accent-color:var(--gold); width:18px; height:18px;">
                        <span>${opt}</span>
                    </label>`;
            });
            inputHtml += '</div>';
        }

        // Nav buttons
        let navBtns = '<div style="display:flex; justify-content:space-between; margin-top:24px;">';
        if (index > 0) navBtns += `<button type="button" class="btn" onclick="goToStep(${index - 1})"><i class="fas fa-arrow-right"></i> السابق</button>`;
        else navBtns += '<div></div>';
        if (index < totalQ - 1) {
            navBtns += `<button type="button" class="btn btn-primary" onclick="goToStep(${index + 1})">التالي <i class="fas fa-arrow-left"></i></button>`;
        } else {
            if (!client.briefAnswers) navBtns += `<button type="submit" class="btn btn-primary" style="background:var(--success); border:none;"><i class="fas fa-paper-plane"></i> إرسال البريف</button>`;
            else navBtns += `<div class="badge badge-success" style="padding:10px 20px; font-size:0.95rem;"><i class="fas fa-check-circle"></i> تم الإرسال مسبقاً</div>`;
        }
        navBtns += '</div>';

        questionsHtml += `
            <div id="q_step_${index}" class="wizard-step ${index === 0 ? '' : 'hidden'}">
                <div class="form-group">
                    <div class="section-title">
                        <div class="section-number">${String(index + 1).padStart(2, '0')}</div>
                        <label class="form-label" style="margin:0; flex:1;">${q.text} ${q.required ? '<span class="gold-text">*</span>' : ''}</label>
                    </div>
                    ${inputHtml}
                </div>
                ${navBtns}
                <div style="text-align:center; margin-top:16px; font-size:0.85rem; color:var(--text-muted);">
                    السؤال ${index + 1} من ${totalQ}
                </div>
            </div>`;
    });

    const briefTab = `
        <div id="ctab_brief_view">
            <div style="margin-bottom:30px;">
                <h1 style="font-size:2rem; font-weight:800; margin-bottom:8px;">
                    كل اللي محتاجين نعرفه<br>عشان نسوّق <span class="gold-text">براندك</span> صح
                </h1>
                <p class="text-muted">مرحباً ${client.name}، برجاء الإجابة على الأسئلة التالية</p>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="wizardProgress" style="width:${(1 / totalQ) * 100}%"></div>
            </div>
            <form id="briefForm" onsubmit="submitBrief(event, '${id}')" style="margin-top:24px;">
                ${questionsHtml}
            </form>
        </div>`;

    // ─── Meeting Tab ───
    let meetingTab = '';
    if (hasBrief) {
        if (client.meetingSlotId) {
            const slot = db.config.slots.find(s => s.id === client.meetingSlotId);
            if (slot) {
                meetingTab = `
                    <div id="ctab_meeting_view" class="hidden">
                        <div class="card" style="text-align:center;">
                            <div style="margin-bottom:20px;">
                                <i class="fas fa-calendar-check text-success" style="font-size:3rem;"></i>
                            </div>
                            <h2 class="text-success" style="margin-bottom:16px;">تم حجز الميتينج بنجاح!</h2>
                            <p style="font-size:1.1rem; margin-bottom:8px;">
                                <i class="fas fa-calendar"></i> <strong>${formatDateTime(slot.dateTime)}</strong>
                            </p>
                            <div id="meetingTimerContainer" class="timer-display">
                                جاري حساب الوقت المتبقي...
                            </div>
                        </div>
                    </div>`;

                const unlockTime = new Date(slot.dateTime).getTime() - (10 * 60 * 1000);
                window.meetingInterval = setInterval(() => {
                    const timerEl = document.getElementById('meetingTimerContainer');
                    if (!timerEl) return clearInterval(window.meetingInterval);
                    const now = Date.now();
                    if (now >= unlockTime) {
                        timerEl.innerHTML = `
                            <p class="text-success" style="font-size:1.2rem; margin-bottom:16px;"><i class="fas fa-door-open"></i> الميتينج متاح الآن!</p>
                            <a href="${slot.link}" target="_blank" class="btn btn-primary" style="padding:14px 40px; font-size:1.1rem;">
                                <i class="fas fa-video"></i> دخول الميتينج
                            </a>`;
                        clearInterval(window.meetingInterval);
                    } else {
                        const diff = unlockTime - now;
                        const d = Math.floor(diff / (1000 * 60 * 60 * 24));
                        const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                        const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                        const s = Math.floor((diff % (1000 * 60)) / 1000);
                        timerEl.innerHTML = `
                            <p class="text-muted" style="margin-bottom:12px;"><i class="fas fa-lock"></i> الرابط يفتح قبل الموعد بـ 10 دقائق</p>
                            <div class="timer-digits">
                                ${d > 0 ? `<div class="timer-unit"><span class="num">${d}</span><span class="label">يوم</span></div>` : ''}
                                <div class="timer-unit"><span class="num">${String(h).padStart(2, '0')}</span><span class="label">ساعة</span></div>
                                <div class="timer-unit"><span class="num">${String(m).padStart(2, '0')}</span><span class="label">دقيقة</span></div>
                                <div class="timer-unit"><span class="num">${String(s).padStart(2, '0')}</span><span class="label">ثانية</span></div>
                            </div>`;
                    }
                }, 1000);
            } else {
                meetingTab = '<div id="ctab_meeting_view" class="hidden"><div class="card"><p class="text-muted">الميعاد الذي اخترته تم حذفه، تواصل مع الميديا باير.</p></div></div>';
            }
        } else {
            // Available slots grouped by day
            const clientSlotsGrouped = {};
            db.config.slots.filter(s => s.status === 'available').forEach(s => {
                const dateStr = formatDate(s.dateTime);
                if (!clientSlotsGrouped[dateStr]) clientSlotsGrouped[dateStr] = [];
                clientSlotsGrouped[dateStr].push(s);
            });

            let availableSlotsHtml = '';
            if (Object.keys(clientSlotsGrouped).length === 0) {
                availableSlotsHtml = `<div class="empty-state"><i class="fas fa-calendar-times"></i><p>لا توجد مواعيد متاحة حالياً<br><span class="text-muted">حاول مرة أخرى لاحقاً</span></p></div>`;
            } else {
                Object.keys(clientSlotsGrouped).forEach(date => {
                    clientSlotsGrouped[date].sort((a, b) => new Date(a.dateTime) - new Date(b.dateTime));
                    let timesHtml = clientSlotsGrouped[date].map(s => `
                        <label class="slot-item" style="cursor:pointer; transition: all var(--transition);" onmouseover="this.style.background='var(--gold-dim)'" onmouseout="this.style.background=''">
                            <div style="display:flex; align-items:center; gap:12px;">
                                <input type="radio" name="slotSelect" value="${s.id}" style="accent-color:var(--gold); width:18px; height:18px;">
                                <span class="slot-time">${formatTime(s.dateTime)}</span>
                            </div>
                        </label>
                    `).join('');

                    availableSlotsHtml += `
                        <div class="slot-day-group" style="margin-bottom:12px;">
                            <button class="slot-day-header" onclick="this.nextElementSibling.classList.toggle('hidden')">
                                <span><i class="fas fa-calendar-day" style="margin-left:8px;"></i> ${date}</span>
                                <i class="fas fa-chevron-down"></i>
                            </button>
                            <div>${timesHtml}</div>
                        </div>`;
                });
            }

            const submitBtn = Object.keys(clientSlotsGrouped).length > 0
                ? `<button onclick="bookMeeting('${id}')" class="btn btn-primary" style="width:100%; padding:14px; margin-top:20px;"><i class="fas fa-check-circle"></i> تأكيد الحجز</button>`
                : '';

            meetingTab = `
                <div id="ctab_meeting_view" class="hidden">
                    <div class="card">
                        <h2 class="gold-text" style="margin-bottom:8px;"><i class="fas fa-calendar-plus"></i> حجز ميتينج الانطلاق</h2>
                        <p class="text-muted" style="margin-bottom:20px;">اضغط على اليوم المناسب لك واختر الوقت</p>
                        ${availableSlotsHtml}
                        ${submitBtn}
                    </div>
                </div>`;
        }
    }

    // ─── Contract Tab ───
    let contractTab = '';
    if (hasContract) {
        const contractLines = db.config.contractTerms.split('\n').map(line => {
            line = line.trim();
            if (!line) return '<br>';
            if (line.startsWith('البند')) return `<h3 style="color:var(--gold); margin-top:24px;">${line}</h3>`;
            return `<p style="margin-bottom:8px;">${line}</p>`;
        }).join('');

        let signSection = '';
        if (!client.contractSigned) {
            signSection = `
                <div class="contract-sign-section">
                    <label style="display:flex; align-items:flex-start; gap:10px; cursor:pointer; margin-bottom:16px;">
                        <input type="checkbox" id="agreeCheck" style="accent-color:var(--gold); width:20px; height:20px; margin-top:4px;">
                        <span style="color:#333;">أقر أنا (${client.name}) بموافقتي إلكترونياً على جميع بنود هذا العقد والتزامي بها.</span>
                    </label>
                    <button onclick="signContract('${id}')" class="btn btn-primary" style="width:100%;">
                        <i class="fas fa-signature"></i> توقيع وإرسال
                    </button>
                </div>`;
        } else {
            signSection = `
                <div style="text-align:center; margin-top:24px; padding:20px; background:var(--success-bg); border-radius:var(--radius-sm);">
                    <i class="fas fa-check-circle text-success" style="font-size:2rem;"></i>
                    <p class="text-success" style="font-weight:700; margin-top:8px;">تم التوقيع إلكترونياً بنجاح من قبل (${client.name})</p>
                </div>
                <button onclick="window.print()" class="btn btn-primary no-print" style="width:100%; margin-top:16px;">
                    <i class="fas fa-print"></i> طباعة / تنزيل PDF
                </button>`;
        }

        contractTab = `
            <div id="ctab_contract_view" class="hidden">
                <div style="margin-bottom:16px;">
                    <h1 style="font-size:1.8rem; font-weight:800;">عقد تقديم خدمات <span class="gold-text">التسويق الرقمي</span></h1>
                </div>
                <div class="contract-body">
                    ${contractLines}
                    <div style="margin-top:40px; border-top:2px dashed #ddd; padding-top:24px;">
                        <h3 style="margin-bottom:16px;">توقيع العقد</h3>
                        <p><strong>الطرف الأول (العميل):</strong> ${client.name}</p>
                        <p><strong>الطرف الثاني:</strong> ${db.config.adminName}</p>
                        ${signSection}
                    </div>
                </div>
            </div>`;
    }

    app.innerHTML = `
        <div class="container">
            <!-- Client Tabs -->
            <div class="tabs no-print" style="margin-bottom:24px;">
                <button class="tab-btn active" onclick="showClientTab('brief')" id="cbtn_brief"><i class="fas fa-clipboard-list"></i> البريف</button>
                ${meetingBtnHtml}
                ${contractBtnHtml}
            </div>

            ${briefTab}
            ${meetingTab}
            ${contractTab}
        </div>
    `;

    // ─── Client Functions ───
    window.goToStep = (targetIndex) => {
        document.querySelectorAll('.wizard-step').forEach(el => el.classList.add('hidden'));
        const targetEl = document.getElementById('q_step_' + targetIndex);
        if (targetEl) { targetEl.classList.remove('hidden'); targetEl.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
        const progress = document.getElementById('wizardProgress');
        if (progress) progress.style.width = ((targetIndex + 1) / totalQ * 100) + '%';
    };

    window.handleFilePreview = (input, qId) => {
        if (input.files.length > 0) {
            const preview = document.getElementById('preview_' + qId);
            if (preview) {
                preview.style.display = 'block';
                preview.innerHTML = `<i class="fas fa-check-circle"></i> تم اختيار: ${input.files[0].name}`;
            }
        }
    };

    window.showClientTab = (tab) => {
        ['brief', 'meeting', 'contract'].forEach(t => {
            const view = document.getElementById('ctab_' + t + '_view');
            const btn = document.getElementById('cbtn_' + t);
            if (view) view.classList.add('hidden');
            if (btn) btn.classList.remove('active');
        });
        const activeView = document.getElementById('ctab_' + tab + '_view');
        const activeBtn = document.getElementById('cbtn_' + tab);
        if (activeView) activeView.classList.remove('hidden');
        if (activeBtn) activeBtn.classList.add('active');
    };

    window.submitBrief = async (e, p) => {
        e.preventDefault();
        const answers = {};
        const promises = db.config.briefQuestions.map(async (q) => {
            if (q.type === 'radio') {
                const checked = document.querySelector(`input[name="${q.id}"]:checked`);
                answers[q.id] = checked ? checked.value : '';
            } else if (q.type === 'file') {
                const fileInput = document.getElementById(q.id);
                if (fileInput && fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    if (file.size > 2.5 * 1024 * 1024) { showToast('حجم الملف كبير جداً! الحد الأقصى 2 ميجا', 'error'); return; }
                    const base64 = await new Promise(resolve => {
                        const reader = new FileReader();
                        reader.onload = e => resolve(e.target.result);
                        reader.readAsDataURL(file);
                    });
                    answers[q.id] = base64;
                }
            } else {
                answers[q.id] = document.getElementById(q.id)?.value || '';
            }
        });

        // Validate required
        let valid = true;
        db.config.briefQuestions.forEach(q => {
            if (q.required) {
                if (q.type === 'radio') {
                    if (!document.querySelector(`input[name="${q.id}"]:checked`)) valid = false;
                } else if (q.type === 'file') {
                    // File is optional by nature in validation here
                } else {
                    if (!(document.getElementById(q.id)?.value || '').trim()) valid = false;
                }
            }
        });
        if (!valid) return showToast('برجاء الإجابة على جميع الأسئلة الإجبارية', 'error');

        await Promise.all(promises);
        db.clients[p].briefAnswers = answers;
        db.clients[p].status = 'brief-done';
        saveDB();
        showToast('تم إرسال البريف بنجاح! 🎉', 'success');
        renderClientApp(document.getElementById('app'), p);
        setTimeout(() => showClientTab('meeting'), 300);
    };

    window.bookMeeting = (p) => {
        const checked = document.querySelector('input[name="slotSelect"]:checked');
        if (!checked) return showToast('برجاء اختيار ميعاد أولاً', 'error');
        const slotId = checked.value;
        const slot = db.config.slots.find(s => s.id === slotId);
        if (!slot || slot.status !== 'available') return showToast('عذراً، تم حجز هذا الميعاد بالفعل', 'error');

        slot.status = 'booked';
        slot.bookedByPhone = p;
        db.clients[p].meetingSlotId = slotId;
        db.clients[p].status = 'meeting-booked';
        saveDB();
        showToast('تم حجز الميتينج بنجاح! 🎉', 'success');
        renderClientApp(document.getElementById('app'), p);
        setTimeout(() => showClientTab('meeting'), 300);
    };

    window.signContract = (p) => {
        const check = document.getElementById('agreeCheck');
        if (!check || !check.checked) return showToast('يجب الموافقة على البنود أولاً', 'error');
        db.clients[p].contractSigned = true;
        db.clients[p].status = 'signed';
        saveDB();
        showToast('تم توقيع العقد بنجاح! 🎉', 'success');
        renderClientApp(document.getElementById('app'), p);
        setTimeout(() => showClientTab('contract'), 300);
    };

    // ─── Default Tab Logic ───
    if (hasContract && !client.contractSigned) {
        showClientTab('contract');
    } else if (hasBrief && !client.meetingSlotId) {
        showClientTab('meeting');
    } else if (hasBrief && client.meetingSlotId) {
        showClientTab('meeting');
    } else {
        showClientTab('brief');
    }
};

// ─── Init ───
navigate();

    </script>
</body>
</html>
