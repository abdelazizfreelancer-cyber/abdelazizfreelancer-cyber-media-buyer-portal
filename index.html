<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Buyer Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
:root {
    --bg-dark: #0f1f1b;
    --bg-card: #182b25;
    --bg-lighter: #1e352e;
    --bg-input: rgba(255,255,255,0.04);
    --gold: #d8a651;
    --gold-hover: #e5b964;
    --gold-dim: rgba(216,166,81,0.15);
    --white: #ffffff;
    --text-main: #e8e8e8;
    --text-muted: #8a9e99;
    --text-placeholder: rgba(255,255,255,0.2);
    --border-color: rgba(255, 255, 255, 0.08);
    --border-active: rgba(216,166,81,0.4);
    --danger: #ff6b6b;
    --danger-bg: rgba(255,107,107,0.1);
    --success: #51cf66;
    --success-bg: rgba(81,207,102,0.1);
    --info: #74c0fc;
    --info-bg: rgba(116,192,252,0.1);
    --shadow: 0 4px 24px rgba(0,0,0,0.3);
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.2);
    --radius: 12px;
    --radius-sm: 8px;
    --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Cairo', sans-serif;
    background-color: var(--bg-dark);
    color: var(--text-main);
    line-height: 1.7;
    direction: rtl;
    text-align: right;
    min-height: 100vh;
}

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg-dark); }
::-webkit-scrollbar-thumb { background: var(--bg-lighter); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--gold); }

h1, h2, h3, h4 { font-weight: 700; }
a { color: var(--gold); text-decoration: none; transition: color var(--transition); }
a:hover { color: var(--gold-hover); }

/* â”€â”€â”€ Utilities â”€â”€â”€ */
.gold-text { color: var(--gold); }
.text-muted { color: var(--text-muted); }
.text-success { color: var(--success); }
.text-danger { color: var(--danger); }
.hidden { display: none !important; }

/* â”€â”€â”€ Container â”€â”€â”€ */
.container {
    max-width: 900px;
    margin: 0 auto;
    padding: 30px 20px;
}

/* â”€â”€â”€ Buttons â”€â”€â”€ */
.btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: transparent;
    border: 1px solid var(--border-active);
    color: var(--gold);
    padding: 10px 24px;
    font-family: 'Cairo', sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    border-radius: var(--radius-sm);
    transition: all var(--transition);
    white-space: nowrap;
}
.btn:hover {
    background: var(--gold);
    color: var(--bg-dark);
    transform: translateY(-1px);
    box-shadow: var(--shadow-sm);
}
.btn:active { transform: translateY(0); }

.btn-primary {
    background: linear-gradient(135deg, var(--gold), #c9943f);
    color: var(--bg-dark);
    border: none;
    font-weight: 700;
}
.btn-primary:hover {
    background: linear-gradient(135deg, var(--gold-hover), var(--gold));
}

.btn-danger {
    border-color: var(--danger);
    color: var(--danger);
}
.btn-danger:hover {
    background: var(--danger);
    color: white;
}

.btn-sm {
    padding: 6px 16px;
    font-size: 0.85rem;
}

.btn-icon {
    width: 40px;
    height: 40px;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
}

.btn-ghost {
    border: none;
    padding: 8px 16px;
}
.btn-ghost:hover {
    background: var(--bg-input);
    color: var(--gold);
    transform: none;
    box-shadow: none;
}

/* â”€â”€â”€ Forms â”€â”€â”€ */
.form-group {
    margin-bottom: 24px;
}

.form-label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
    font-size: 0.95rem;
    color: var(--text-main);
}

.form-input, .form-select, .form-textarea {
    width: 100%;
    background: var(--bg-input);
    border: 1px solid var(--border-color);
    color: var(--white);
    padding: 12px 16px;
    font-family: 'Cairo', sans-serif;
    font-size: 1rem;
    border-radius: var(--radius-sm);
    transition: all var(--transition);
}
.form-input:focus, .form-select:focus, .form-textarea:focus {
    outline: none;
    border-color: var(--gold);
    background: rgba(255,255,255,0.06);
    box-shadow: 0 0 0 3px var(--gold-dim);
}
.form-input::placeholder { color: var(--text-placeholder); }

.form-textarea {
    resize: vertical;
    min-height: 120px;
}

/* â”€â”€â”€ Cards â”€â”€â”€ */
.card {
    background: var(--bg-card);
    padding: 24px;
    border-radius: var(--radius);
    margin-bottom: 20px;
    border: 1px solid var(--border-color);
    transition: all var(--transition);
}
.card:hover {
    border-color: rgba(255,255,255,0.12);
}

.card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border-color);
}

/* â”€â”€â”€ Stats Cards â”€â”€â”€ */
.stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
    margin-bottom: 30px;
}

.stat-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius);
    padding: 20px;
    text-align: center;
    transition: all var(--transition);
}
.stat-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow);
    border-color: var(--border-active);
}

.stat-icon {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
    margin-bottom: 12px;
}
.stat-icon.gold { background: var(--gold-dim); color: var(--gold); }
.stat-icon.green { background: var(--success-bg); color: var(--success); }
.stat-icon.blue { background: var(--info-bg); color: var(--info); }
.stat-icon.red { background: var(--danger-bg); color: var(--danger); }

.stat-number {
    font-size: 2rem;
    font-weight: 800;
    color: var(--white);
    line-height: 1;
    margin-bottom: 4px;
}

.stat-label {
    font-size: 0.85rem;
    color: var(--text-muted);
}

/* â”€â”€â”€ Dashboard Header â”€â”€â”€ */
.dashboard-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
    padding: 20px 0;
}

.dashboard-header h1 {
    font-size: 1.8rem;
    display: flex;
    align-items: center;
    gap: 12px;
}

.header-actions {
    display: flex;
    gap: 10px;
    align-items: center;
}

/* â”€â”€â”€ Tabs â”€â”€â”€ */
.tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 24px;
    background: var(--bg-card);
    border-radius: var(--radius);
    padding: 4px;
    border: 1px solid var(--border-color);
    overflow-x: auto;
}

.tab-btn {
    flex: 1;
    padding: 12px 20px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-family: 'Cairo', sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    border-radius: var(--radius-sm);
    transition: all var(--transition);
    white-space: nowrap;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
}
.tab-btn:hover {
    color: var(--white);
    background: rgba(255,255,255,0.05);
}
.tab-btn.active {
    background: var(--gold);
    color: var(--bg-dark);
}
.tab-btn .badge-count {
    background: rgba(255,255,255,0.2);
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 0.75rem;
}
.tab-btn.active .badge-count {
    background: rgba(0,0,0,0.2);
}

/* â”€â”€â”€ Client Card (List) â”€â”€â”€ */
.client-list-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px;
    background: var(--bg-lighter);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    margin-bottom: 10px;
    transition: all var(--transition);
    cursor: pointer;
}
.client-list-item:hover {
    border-color: var(--border-active);
    background: rgba(216,166,81,0.05);
    transform: translateX(-4px);
}

.client-info {
    display: flex;
    align-items: center;
    gap: 16px;
}

.client-avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--gold-dim);
    color: var(--gold);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 1.1rem;
    flex-shrink: 0;
}

.client-name {
    font-weight: 700;
    font-size: 1rem;
    margin-bottom: 2px;
}

.client-phone {
    font-size: 0.85rem;
    color: var(--text-muted);
    direction: ltr;
    text-align: right;
}

.client-badges {
    display: flex;
    gap: 6px;
}

/* â”€â”€â”€ Badges â”€â”€â”€ */
.badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 600;
}
.badge-success { background: var(--success-bg); color: var(--success); }
.badge-warning { background: var(--gold-dim); color: var(--gold); }
.badge-danger { background: var(--danger-bg); color: var(--danger); }
.badge-info { background: var(--info-bg); color: var(--info); }

/* â”€â”€â”€ Section Title â”€â”€â”€ */
.section-title {
    color: var(--gold);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 1.15rem;
}

.section-number {
    background: var(--gold-dim);
    color: var(--gold);
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    font-weight: 800;
    font-size: 0.9rem;
    flex-shrink: 0;
}

/* â”€â”€â”€ Slot / Meeting â”€â”€â”€ */
.slot-day-group {
    margin-bottom: 12px;
    background: rgba(255,255,255,0.02);
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-color);
    overflow: hidden;
}

.slot-day-header {
    padding: 14px 20px;
    cursor: pointer;
    font-weight: 700;
    color: var(--gold);
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(216,166,81,0.05);
    border: none;
    width: 100%;
    font-family: 'Cairo', sans-serif;
    font-size: 1rem;
    text-align: right;
    direction: rtl;
}
.slot-day-header:hover {
    background: rgba(216,166,81,0.1);
}

.slot-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 20px;
    border-top: 1px solid var(--border-color);
}

.slot-time {
    font-weight: 700;
    font-size: 1.05rem;
}

.slot-link {
    font-size: 0.8rem;
    color: var(--text-muted);
    direction: ltr;
    word-break: break-all;
}

/* â”€â”€â”€ Toast / Notifications â”€â”€â”€ */
#toast-container {
    position: fixed;
    bottom: 20px;
    left: 20px;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.toast {
    padding: 14px 24px;
    border-radius: var(--radius-sm);
    font-family: 'Cairo', sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 10px;
    animation: slideInToast 0.4s ease;
    box-shadow: var(--shadow);
    min-width: 300px;
    max-width: 450px;
}
.toast-success { background: #1a3a2a; color: var(--success); border: 1px solid rgba(81,207,102,0.3); }
.toast-error { background: #3a1a1a; color: var(--danger); border: 1px solid rgba(255,107,107,0.3); }
.toast-info { background: #1a2a3a; color: var(--info); border: 1px solid rgba(116,192,252,0.3); }
.toast-warning { background: #3a2a1a; color: var(--gold); border: 1px solid rgba(216,166,81,0.3); }

@keyframes slideInToast {
    from { transform: translateX(-100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
}

/* â”€â”€â”€ Empty State â”€â”€â”€ */
.empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-muted);
}
.empty-state i {
    font-size: 3rem;
    margin-bottom: 16px;
    opacity: 0.3;
}
.empty-state p {
    font-size: 1rem;
}

/* â”€â”€â”€ Progress Bar (for wizard) â”€â”€â”€ */
.progress-bar-container {
    width: 100%;
    height: 4px;
    background: var(--border-color);
    border-radius: 2px;
    margin-bottom: 30px;
    overflow: hidden;
}
.progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold), var(--gold-hover));
    border-radius: 2px;
    transition: width 0.5s ease;
}

/* â”€â”€â”€ Wizard Question â”€â”€â”€ */
.wizard-step {
    animation: fadeInStep 0.4s ease;
}
@keyframes fadeInStep {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

/* â”€â”€â”€ Upload Box â”€â”€â”€ */
.upload-box {
    border: 2px dashed var(--border-color);
    padding: 30px;
    text-align: center;
    cursor: pointer;
    transition: all var(--transition);
    background: rgba(255,255,255,0.02);
    border-radius: var(--radius);
}
.upload-box:hover {
    border-color: var(--gold);
    background: var(--gold-dim);
}
.upload-box input { display: none; }
.upload-box i { font-size: 2rem; color: var(--text-muted); margin-bottom: 10px; }

/* â”€â”€â”€ Contract â”€â”€â”€ */
.contract-body {
    background: #fefefe;
    color: #1a1a1a;
    padding: 40px;
    border-radius: var(--radius);
    line-height: 2;
    font-size: 1.05rem;
}
.contract-body h3 {
    color: #333;
    margin: 20px 0 10px;
}

.contract-sign-section {
    background: #f8f6f0;
    padding: 24px;
    border-radius: var(--radius-sm);
    border-right: 4px solid var(--gold);
    margin-top: 24px;
}

/* â”€â”€â”€ Timer â”€â”€â”€ */
.timer-display {
    background: rgba(0,0,0,0.3);
    padding: 24px;
    border-radius: var(--radius);
    text-align: center;
    margin-top: 20px;
}
.timer-digits {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin: 16px 0;
}
.timer-unit {
    text-align: center;
}
.timer-unit .num {
    font-size: 2.2rem;
    font-weight: 800;
    color: var(--gold);
    display: block;
    line-height: 1;
}
.timer-unit .label {
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-top: 4px;
}

/* â”€â”€â”€ Accordion â”€â”€â”€ */
.accordion-item {
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    margin-bottom: 10px;
    overflow: hidden;
}
.accordion-header {
    width: 100%;
    padding: 16px 20px;
    background: var(--bg-lighter);
    border: none;
    color: var(--text-main);
    font-family: 'Cairo', sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    text-align: right;
    direction: rtl;
    transition: background var(--transition);
}
.accordion-header:hover { background: rgba(216,166,81,0.08); }
.accordion-header i { transition: transform var(--transition); }
.accordion-header.open i { transform: rotate(180deg); }
.accordion-body {
    padding: 16px 20px;
    border-top: 1px solid var(--border-color);
}

/* â”€â”€â”€ Modal â”€â”€â”€ */
.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    animation: fadeIn 0.2s ease;
}
.modal-content {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius);
    padding: 32px;
    width: 90%;
    max-width: 500px;
    max-height: 80vh;
    overflow-y: auto;
    box-shadow: var(--shadow);
    animation: scaleIn 0.3s ease;
}
.modal-title {
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--gold);
    margin-bottom: 20px;
}
@keyframes fadeIn { from { opacity:0 } to { opacity:1 } }
@keyframes scaleIn { from { opacity:0; transform:scale(0.95) } to { opacity:1; transform:scale(1) } }

/* â”€â”€â”€ Start page â”€â”€â”€ */
.start-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}
.start-content {
    text-align: center;
    max-width: 600px;
    padding: 40px 20px;
}
.start-logo {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: var(--gold-dim);
    color: var(--gold);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    margin: 0 auto 24px;
    border: 2px solid var(--border-active);
}
.start-content h1 {
    font-size: 2.2rem;
    margin-bottom: 12px;
}
.start-content p {
    color: var(--text-muted);
    margin-bottom: 30px;
    font-size: 1.05rem;
}

/* â”€â”€â”€ Login Card â”€â”€â”€ */
.login-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}
.login-card {
    width: 90%;
    max-width: 420px;
    padding: 40px;
}
.login-card h2 {
    text-align: center;
    margin-bottom: 8px;
}
.login-card p {
    text-align: center;
    color: var(--text-muted);
    margin-bottom: 30px;
}

/* â”€â”€â”€ Search Bar â”€â”€â”€ */
.search-bar {
    position: relative;
    margin-bottom: 20px;
}
.search-bar input {
    width: 100%;
    padding: 12px 16px 12px 44px;
    background: var(--bg-input);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    color: var(--white);
    font-family: 'Cairo', sans-serif;
    font-size: 0.95rem;
    transition: all var(--transition);
}
.search-bar input:focus {
    outline: none;
    border-color: var(--gold);
}
.search-bar i {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
}

/* â”€â”€â”€ Answer Card (Admin View) â”€â”€â”€ */
.answer-item {
    background: rgba(255,255,255,0.03);
    padding: 16px 20px;
    border-radius: var(--radius-sm);
    margin-bottom: 12px;
    border-right: 3px solid var(--gold);
}
.answer-item .q-text {
    font-weight: 700;
    color: var(--gold);
    margin-bottom: 8px;
    font-size: 0.95rem;
}
.answer-item .a-text {
    color: var(--text-main);
    font-size: 1rem;
}
.answer-item img {
    max-width: 100%;
    max-height: 300px;
    border-radius: var(--radius-sm);
    margin-top: 10px;
    border: 1px solid var(--border-color);
}

/* â”€â”€â”€ Client Profile Header â”€â”€â”€ */
.profile-header {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 8px;
}
.profile-avatar {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: var(--gold-dim);
    color: var(--gold);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.6rem;
    font-weight: 800;
    flex-shrink: 0;
    border: 2px solid var(--border-active);
}

/* â”€â”€â”€ Responsive â”€â”€â”€ */
@media (max-width: 768px) {
    .dashboard-header {
        flex-direction: column;
        gap: 16px;
        align-items: flex-start;
    }
    .header-actions {
        width: 100%;
        justify-content: flex-end;
    }
    .stats-grid {
        grid-template-columns: repeat(2, 1fr);
    }
    .client-list-item {
        flex-direction: column;
        gap: 12px;
        align-items: flex-start;
    }
    .tabs {
        overflow-x: auto;
    }
    .tab-btn {
        min-width: fit-content;
        flex: none;
